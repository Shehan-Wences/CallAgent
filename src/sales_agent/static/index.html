<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sales Agent — Call Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { margin-bottom: 0.5rem; }
  .row { display: flex; gap: 0.75rem; align-items: end; flex-wrap: wrap; margin-bottom: 1rem; }
  label { display: flex; flex-direction: column; font-size: 0.85rem; color: #444; gap: 0.25rem; }
  input, select { font-size: 1rem; padding: 0.4rem; }
  input[type=text] { width: 10rem; }
  button { font-size: 1rem; padding: 0.55rem 1.1rem; border-radius: 0.5rem; cursor: pointer; border: 1px solid #ccc; background: #f7f7f7; }
  button#call { background: #16a34a; color: #fff; border-color: #16a34a; }
  button#call.active { background: #dc2626; border-color: #dc2626; }
  #status { margin: 0.5rem 0 1rem; color: #555; }
  #transcript { border: 1px solid #ddd; border-radius: 0.5rem; height: 22rem; overflow-y: auto;
                padding: 0.75rem; background: #fafafa; }
  #transcript:empty::before { content: "Transcript will appear here once the call starts."; color: #aaa; }
  .line { margin-bottom: 0.6rem; line-height: 1.4; }
  .line .who { font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .line.user .who { color: #2563eb; }
  .line.assistant .who { color: #16a34a; }
  .line .txt { display: block; }
</style>
</head>
<body>
  <h1>Sales Agent</h1>

  <div class="row">
    <label>Product / campaign
      <select id="campaign"></select>
    </label>
    <label>Upload campaign (.md)
      <input type="file" id="file" accept=".md,.markdown,text/markdown" />
    </label>
    <button id="upload">Upload</button>
  </div>

  <div class="row">
    <label>Lead name
      <input type="text" id="lead" value="there" />
    </label>
    <button id="call">Start call</button>
  </div>

  <div class="row">
    <label>Phone number (E.164)
      <input type="text" id="phonenum" placeholder="+61412345678" />
    </label>
    <button id="phone">Call phone (Twilio)</button>
  </div>

  <div id="status">Idle.</div>
  <div id="transcript"></div>

<script>
const SAMPLE_RATE = 24000;       // OpenAI realtime pcm16 mono
let ctx, micStream, node, ws, playHead = 0, calling = false;
let scheduledSources = [];
const assistantLines = {};       // item_id -> .txt element being streamed
const statusEl = document.getElementById("status");
const btn = document.getElementById("call");
const campaignSel = document.getElementById("campaign");
const transcriptEl = document.getElementById("transcript");

function setStatus(s) { statusEl.textContent = s; }

// ---- Campaign list + upload -------------------------------------------------
async function loadCampaigns() {
  try {
    const data = await (await fetch("/campaigns")).json();
    campaignSel.innerHTML = "";
    for (const c of data.campaigns) {
      const opt = document.createElement("option");
      opt.value = c.file;
      opt.textContent = (c.product ? c.product + "  (" + c.file + ")" : c.file) + (c.valid ? "" : "  — invalid");
      opt.disabled = !c.valid;
      if (c.file === data.default) opt.selected = true;
      campaignSel.appendChild(opt);
    }
    if (!data.campaigns.length) {
      const opt = document.createElement("option");
      opt.textContent = "(no campaigns found)";
      opt.disabled = true;
      campaignSel.appendChild(opt);
    }
  } catch (e) { setStatus("Could not load campaigns: " + e.message); }
}

document.getElementById("upload").onclick = async () => {
  const f = document.getElementById("file").files[0];
  if (!f) { setStatus("Pick a .md file first."); return; }
  setStatus("Uploading " + f.name + "…");
  const text = await f.text();
  const res = await fetch("/campaigns?file=" + encodeURIComponent(f.name), {
    method: "POST", headers: { "Content-Type": "text/markdown" }, body: text,
  });
  const body = await res.json();
  if (!res.ok || !body.ok) { setStatus("Upload rejected: " + (body.error || res.status)); return; }
  setStatus("Uploaded '" + body.product + "' (" + body.file + ").");
  await loadCampaigns();
  campaignSel.value = body.file;
};

// ---- Transcript -------------------------------------------------------------
function addLine(role, text) {
  const line = document.createElement("div");
  line.className = "line " + role;
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = role === "user" ? "You" : "Agent";
  const txt = document.createElement("span");
  txt.className = "txt";
  txt.textContent = text || "";
  line.appendChild(who); line.appendChild(txt);
  transcriptEl.appendChild(line);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  return txt;
}

function handleTranscript(msg) {
  if (msg.role === "assistant") {
    let txt = assistantLines[msg.item_id];
    if (!txt) { txt = addLine("assistant", ""); assistantLines[msg.item_id] = txt; }
    txt.textContent += msg.delta || "";
  } else {
    addLine("user", msg.text || "");
  }
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// ---- Audio ------------------------------------------------------------------
function floatToPCM16(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function pcm16ToFloat(int16) {
  const out = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) out[i] = int16[i] / 0x8000;
  return out;
}

function flushPlayback() {
  for (const s of scheduledSources) {
    try { s.stop(); } catch (e) { /* already stopped */ }
  }
  scheduledSources = [];
  if (ctx) playHead = ctx.currentTime;
}

function playChunk(arrayBuffer) {
  const int16 = new Int16Array(arrayBuffer);
  const float = pcm16ToFloat(int16);
  const buf = ctx.createBuffer(1, float.length, SAMPLE_RATE);
  buf.copyToChannel(float, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  if (playHead < now) playHead = now;
  src.start(playHead);
  playHead += buf.duration;
  scheduledSources.push(src);
  src.onended = () => { scheduledSources = scheduledSources.filter((s) => s !== src); };
}

async function startCall() {
  transcriptEl.innerHTML = "";
  for (const k in assistantLines) delete assistantLines[k];

  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  // Echo cancellation stops the mic from hearing the agent's own voice through
  // the speakers (which otherwise makes the agent interrupt itself).
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  const source = ctx.createMediaStreamSource(micStream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  source.connect(node);
  node.connect(ctx.destination);

  const lead = encodeURIComponent(document.getElementById("lead").value || "there");
  const campaign = encodeURIComponent(campaignSel.value || "");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/session?lead_name=${lead}&campaign=${campaign}`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => setStatus("Connected — talk!");
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "interrupted") flushPlayback();
      else if (msg.type === "transcript") handleTranscript(msg);
      return;
    }
    playChunk(ev.data);
  };
  ws.onclose = () => { setStatus("Call ended."); cleanup(); };
  ws.onerror = () => setStatus("Connection error.");

  node.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const pcm = floatToPCM16(e.inputBuffer.getChannelData(0));
    ws.send(pcm.buffer);
  };
}

function cleanup() {
  calling = false;
  scheduledSources = [];
  btn.textContent = "Start call";
  btn.classList.remove("active");
  campaignSel.disabled = false;
  if (node) { node.disconnect(); node.onaudioprocess = null; }
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
}

btn.onclick = async () => {
  if (calling) { if (ws) ws.close(); return; }
  calling = true;
  btn.textContent = "End call";
  btn.classList.add("active");
  campaignSel.disabled = true;
  setStatus("Connecting…");
  try { await startCall(); }
  catch (err) { setStatus("Mic/connection failed: " + err.message); cleanup(); }
};

// ---- Phone call via Twilio (audio is on the phone; we only watch the transcript) ----
let monitorWs = null;
const phoneBtn = document.getElementById("phone");

phoneBtn.onclick = async () => {
  const phone = document.getElementById("phonenum").value.trim();
  if (!phone) { setStatus("Enter a phone number in E.164 format, e.g. +61412345678."); return; }
  transcriptEl.innerHTML = "";
  for (const k in assistantLines) delete assistantLines[k];

  const proto = location.protocol === "https:" ? "wss" : "ws";
  setStatus("Setting up call…");
  monitorWs = new WebSocket(`${proto}://${location.host}/monitor`);
  monitorWs.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "call_id") {
      setStatus("Dialing " + phone + "…");
      const res = await fetch("/call", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phone, call_id: msg.call_id,
          campaign: campaignSel.value || "",
          lead_name: document.getElementById("lead").value || "there",
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.ok) {
        setStatus("Call failed: " + (body.error || res.status));
        if (monitorWs) monitorWs.close();
      }
    } else if (msg.type === "transcript") {
      handleTranscript(msg);
    } else if (msg.type === "status") {
      setStatus("Phone: " + msg.status + (msg.phone ? " (" + msg.phone + ")" : ""));
    }
  };
  monitorWs.onerror = () => setStatus("Monitor connection error.");
};

loadCampaigns();
</script>
</body>
</html>
